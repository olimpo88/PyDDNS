name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pyddns
          POSTGRES_PASSWORD: pyddns
          POSTGRES_DB: pyddns
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DB_HOST: localhost
      DB_NAME: pyddns
      DB_USER: pyddns
      DB_PASSWORD: pyddns
      ENABLE_REST_API: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r docker/requirements-dev.txt

      - name: Run tests
        working-directory: appdata/pyddns
        run: pytest -v

      - name: Lint with ruff
        working-directory: appdata/pyddns
        run: ruff check . --output-format=github
